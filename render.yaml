services:
  - type: web
    name: jeddah-gate-agency
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@10.12.1 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PRIVATE_OWNER_ADMIN
        value: "false"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DB_FILE
        value: /var/data/jeddah.sqlite
      - key: NODE_MEDIA_DIR
        value: /var/data/media
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk:
      name: jeddah-gate-data
      mountPath: /var/data
      sizeGB: 1
