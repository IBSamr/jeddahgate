services:
  - type: web
    name: jeddah-gate-agency
    runtime: node
    plan: starter
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && HOSTINGER_BUILD=true pnpm exec next build --webpack && cp -a public .next/standalone/public && mkdir -p .next/standalone/.next/static && cp -a .next/static/. .next/standalone/.next/static/
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PRIVATE_OWNER_ADMIN
        value: "false"
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DB_FILE
        value: /var/data/jeddah.sqlite
      - key: NODE_MEDIA_DIR
        value: /var/data/media
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk:
      name: jeddah-gate-data
      mountPath: /var/data
      sizeGB: 1
